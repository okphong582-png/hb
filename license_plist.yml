options:
  licenseFileNames:
    - LICENSE
  packagePaths:
    - Package.swift
  prefix: com.highsign.com
  xcworkspacePath: "*.xcworkspace"
  addVersionNumbers: false
  singlePage: false
  sandboxMode: true
  force: true

manual:
  - source: https://github.com/jkcoxson/idevice
    name: idevice
    body: |-
      MIT License
  - name: "Zsign"
    body: |-
      MIT License
      Copyright (c) 2026 zhlynn
  - name: "LiveContainer"
    body: |-
      MIT License
      Copyright (c) LiveContainer
  - name: "ElleKit"
    body: |-
      Copyright (c) 2022 Évelyne Bélanger All rights reserved.

exclude:
  - swift-html-entities
  - LicensePlist
  - XcodeEdit
  - Yams
  - /.*-kit/
