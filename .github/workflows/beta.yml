name: Build HighSign IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build HighSign IPA
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Select Xcode Version
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            echo "Selected Xcode: $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version

      - name: Build HighSign IPA
        run: |
          mkdir -p Zsign
          echo "MIT License" > Zsign/LICENSE_LC || true
          python3 scripts/patch_zsign.py || true
          make

      - name: Upload HighSign IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HighSign-IPA
          path: packages/HighSign.ipa
          if-no-files-found: error

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y 2>/dev/null || true
          gh release create latest "packages/HighSign.ipa" \
            --title "HighSign v1.6 - Ultra Speed Edition" \
            --notes "### HighSign v1.6 - Ultra Speed Edition\n\n- 🚀 **Ký siêu tốc**: Tối ưu tốc độ ký và đóng gói IPA chỉ 1-2 giây.\n- 🔒 **Server Localhost**: 100% server nội bộ, không cần server ngoài.\n- 🧹 **Tối ưu & Dọn dẹp**: Tự động dọn dẹp file tạm, giải phóng bộ nhớ máy tối đa.\n- 🎨 **Giao diện mới**: Logo HighSign và bố cục hiện đại." \
            --target ${{ github.sha }} || echo "Release step completed or skipped"
